[build]
publish = "dist"
command = "yarn build"

[[redirects]]
from = "/sitemap.xml"
to = "/sitemap-index.xml"
status = 301

[[headers]]
for = "/_astro/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/images/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
